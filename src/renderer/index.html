<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>ヨツマド</title>
  <link rel="stylesheet" href="styles/main.css"/>
</head>
<body>
  <div id="app">
    <!-- 左：クイックアクセス -->
    <aside id="sidebar">
      <div id="sidebar-navigation">
      <div class="sidebar-section">
        <div class="sidebar-heading-row">
          <div class="sidebar-heading">クイックアクセス</div>
          <button type="button" class="sidebar-add" id="quick-add-btn" title="現在のフォルダを追加">＋ 追加</button>
        </div>
        <ul id="quick-list"></ul>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-heading">ドライブ</div>
        <ul id="drive-list"></ul>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-heading">場所</div>
        <ul id="special-list">
          <li data-special="downloads">⬇ ダウンロード</li>
          <li data-special="desktop">🖥 デスクトップ</li>
          <li data-special="trash">🗑 ゴミ箱</li>
        </ul>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-heading">テーマ</div>
        <div id="theme-list">
          <div class="theme-swatch" data-theme-value="light" title="白"><span class="swatch-dot swatch-light"></span></div>
          <div class="theme-swatch" data-theme-value="gray" title="薄いグレー"><span class="swatch-dot swatch-gray"></span></div>
          <div class="theme-swatch" data-theme-value="dark" title="紺"><span class="swatch-dot swatch-dark"></span></div>
        </div>
      </div>
      </div>
      <section id="preview-panel">
        <div id="preview-header">
          <span id="preview-title">プレビュー</span>
          <button id="preview-close" title="プレビューを閉じる">✕</button>
        </div>
        <div id="preview-content"><div class="preview-nopreview">ファイルを選択すると表示します</div></div>
      </section>
      <button id="preview-toggle-btn" title="プレビューを開く">プレビューを開く</button>
    </aside>

    <!-- 中央：4ペイン -->
    <main id="pane-area">
      <div class="pane-row">
        <div class="pane" id="pane-0"></div>
        <div class="pane-divider-v"></div>
        <div class="pane" id="pane-1"></div>
      </div>
      <div class="pane-divider-h"></div>
      <div class="pane-row">
        <div class="pane" id="pane-2"></div>
        <div class="pane-divider-v"></div>
        <div class="pane" id="pane-3"></div>
      </div>
    </main>

  </div>

  <!-- インライン入力ダイアログ -->
  <div id="input-dialog-overlay" style="display:none">
    <div id="input-dialog">
      <div id="input-dialog-label"></div>
      <input id="input-dialog-field" type="text"/>
      <div id="input-dialog-btns">
        <button id="input-dialog-ok">OK</button>
        <button id="input-dialog-cancel">キャンセル</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
